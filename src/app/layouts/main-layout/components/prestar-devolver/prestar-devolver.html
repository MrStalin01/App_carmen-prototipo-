<h3 mat-dialog-title>Prestar / devolver herramienta</h3>

<mat-dialog-content>
  <mat-tab-group>
    <!-- Pestaña Prestar -->
    <mat-tab label="Prestar">
      <div class="tab-content">
        <div class="campo">
          <label>Herramienta</label>
          <select [(ngModel)]="herramientaSeleccionadaId">
            <option [value]="null">-- Selecciona --</option>
            <option *ngFor="let tool of disponibles" [ngValue]="tool.id">
              {{ tool.nombre }} - {{ tool.descripcion }}
            </option>
          </select>
        </div>

        <div class="campo">
          <label>Prestado a</label>
          <input
            [(ngModel)]="entidadAjena"
            (input)="validarEntidadAjena()"
            (blur)="validarEntidadAjena()"
            placeholder="Nombre o entidad"
          />
          <small class="error" *ngIf="errorEntidadAjena">{{ errorEntidadAjena }}</small>
        </div>

        <div class="campo">
          <label>Anotaciones</label>
          <textarea
            [(ngModel)]="anotacionesPrestamo"
            (input)="validarAnotacionesPrestamo()"
            (blur)="validarAnotacionesPrestamo()"
            rows="2"
            placeholder="Estado de la herramienta"
          ></textarea>
          <small class="error" *ngIf="errorAnotacionesPrestamo">{{
            errorAnotacionesPrestamo
          }}</small>
        </div>

        <button
          class="btn-prestar"
          (click)="prestar()"
          [disabled]="
            !herramientaSeleccionadaId ||
            !entidadAjena.trim() ||
            anotacionesPrestamo.trim().length < 5
          "
        >
          Confirmar préstamo
        </button>
      </div>
    </mat-tab>

    <!-- Pestaña Devolver -->
    <mat-tab label="Devolver">
      <div class="tab-content">
        <div class="campo">
          <label>Herramienta</label>
          <select [(ngModel)]="herramientaDevueltaId">
            <option [value]="null">-- Selecciona --</option>
            <option *ngFor="let tool of prestados" [ngValue]="tool.id">
              {{ tool.nombre }} - {{ tool.descripcion }}
            </option>
          </select>
        </div>

        <div class="campo">
          <label>Anotaciones</label>
          <textarea
            [(ngModel)]="anotacionesDevolucion"
            (input)="validarAnotacionesDevolucion()"
            (blur)="validarAnotacionesDevolucion()"
            rows="2"
            placeholder="Cómo se devuelve, si tiene daños"
          ></textarea>
          <small class="error" *ngIf="errorAnotacionesDevolucion">{{
            errorAnotacionesDevolucion
          }}</small>
        </div>

        <button
          class="btn-devolver"
          (click)="devolver()"
          [disabled]="!herramientaDevueltaId || anotacionesDevolucion.trim().length < 5"
        >
          Confirmar devolución
        </button>
      </div>
    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
</mat-dialog-actions>
